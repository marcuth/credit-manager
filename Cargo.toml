[package]
name = "credit-manager"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Marcuth <me@marcuth.dev>"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
qrcode = "0.14.1"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ureq = { version = "3.5.1", features = ["json"] }
whatsapp-rust = { version = "0.7.0", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "tokio-native", "ureq-client"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
